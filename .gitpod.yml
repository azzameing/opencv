tasks:
  - init: |
      git clone https://github.com/emscripten-core/emsdk.git
      cd emsdk
      ./emsdk install latest
      ./emsdk activate latest
      source ./emsdk_env.sh
      cd ..
      git clone https://github.com/opencv/opencv_contrib.git
      python3 -m pip install numpy
      mkdir build
    command: |
      cd build
      emcmake cmake -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules ../opencv
      emmake make -j$(nproc)
      echo "OpenCV.js build is complete!"
