image:
  file: .gitpod.Dockerfile

tasks:
  - name: opencv.js (wasm + threads + simd + contrib)
    init: |
      set -euo pipefail
      export MAKEFLAGS="-j$(nproc)"

      # 0) Ensure EMSDK is active if present
      if [ -f "/opt/emsdk/emsdk_env.sh" ]; then
        source /opt/emsdk/emsdk_env.sh
      fi

      # 1) Clone contrib modules (match current branch, fallback to 4.x)
      OPENCV_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 4.x)"
      if [ ! -d "./opencv_contrib" ]; then
        echo "Cloning opencv_contrib (${OPENCV_BRANCH})..."
        git clone --depth=1 -b "${OPENCV_BRANCH}" https://github.com/opencv/opencv_contrib.git \
        || git clone --depth=1 -b "4.x" https://github.com/opencv/opencv_contrib.git
      fi

      # 2) (NEW) Generate compile_commands.json for clangd
      #    We do a lightweight native CMake *configure* (no build) with contrib enabled.
      #    This is fast and only writes compile_commands.json so clangd works out of the box.
      CMAKE_CC_DIR="build_cc"
      CMAKE_OPTS="-DOPENCV_EXTRA_MODULES_PATH=$(pwd)/opencv_contrib/modules
                  -DCMAKE_BUILD_TYPE=Release
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                  -DBUILD_TESTS=OFF
                  -DBUILD_PERF_TESTS=OFF
                  -DBUILD_EXAMPLES=OFF
                  -DBUILD_opencv_js=OFF"

      cmake -S . -B "${CMAKE_CC_DIR}" -G Ninja ${CMAKE_OPTS}
      # Make it visible at repo root for clangd (clangd searches up the tree)
      ln -sf "${CMAKE_CC_DIR}/compile_commands.json" compile_commands.json
      echo "compile_commands.json ready -> $(readlink -f compile_commands.json)"

      # 3) Build OpenCV.js (separate .wasm + threads + SIMD + contrib)
      mkdir -p build_js
      emcmake python3 ./platforms/js/build_js.py build_js \
        --disable_single_file --threads --simd \
        --cmake_option="-DOPENCV_EXTRA_MODULES_PATH=$(pwd)/opencv_contrib/modules"

      echo "==== Artifacts in build_js/bin ===="
      ls -lh build_js/bin || true

    command: |
      # Serve artifacts (opencv.js, *.wasm, tests.html) on port 8080
      cd build_js/bin || exit 0
      npx http-server -p 8080 --cors

ports:
  - name: OpenCV.js test server
    port: 8080
    onOpen: open-browser


